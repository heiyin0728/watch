<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>QEH Watch 中控台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      width: 100%; height: 100%; background: #000000; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Noto Sans TC", sans-serif;
      overflow: hidden;
    }
    #app {
      width: 100%; height: 100%; max-width: 380px; margin: 0 auto;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 12px 10px 10px 10px;
    }
    .top-bar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 800; color: #9ca3af; }
    .tab-btns { display: flex; gap: 6px; }
    .tab-btn { background: #1c1c1e; color: #fff; border: 1px solid #333; border-radius: 99px; padding: 3px 10px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .tab-btn.active { background: #0a84ff; border-color: #0a84ff; }
    .card { background: #1c1c1e; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 10px 12px; }
    .bat-row { display: flex; justify-content: space-between; background: #000; border-radius: 10px; padding: 4px 10px; font-size: 11px; font-weight: 800; margin-bottom: 6px; }
    .date-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; color: #7dd3fc; }
    .time-big { text-align: center; font-size: 32px; font-weight: 900; letter-spacing: -0.5px; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .time-sec { font-size: 18px; color: #30d158; margin-left: 2px; }
    .lunar-card { display: flex; justify-content: space-between; align-items: center; border-color: rgba(245,158,11,0.3); font-size: 12px; font-weight: 800; color: #fde68a; }
    .badge { background: rgba(245,158,11,0.2); color: #fcd34d; padding: 2px 8px; border-radius: 8px; font-size: 11px; }
    .weather-head { display: flex; justify-content: space-between; align-items: center; font-size: 10px; font-weight: 700; margin-bottom: 6px; color: #7dd3fc; }
    .warn-tag { background: rgba(16,185,129,0.2); color: #6ee7b7; padding: 2px 6px; border-radius: 6px; }
    .warn-active { background: #dc2626; color: #fff; }
    .weather-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
    .w-box { background: rgba(0,0,0,0.45); border-radius: 10px; padding: 5px 2px; }
    .w-lbl { font-size: 10px; color: #9ca3af; }
    .w-val { font-size: 14px; font-weight: 900; margin-top: 1px; }
    .panel { display: none; flex: 1; flex-direction: column; justify-content: center; gap: 8px; overflow-y: auto; }
    .panel.show { display: flex; }
    .duty-item { display: flex; justify-content: space-between; align-items: center; background: #1c1c1e; padding: 8px 10px; border-radius: 12px; font-size: 13px; font-weight: 800; }
    .duty-me { border: 1px solid #30d158; background: rgba(48,209,88,0.15); }
    .code-tag { background: #333; padding: 2px 8px; border-radius: 6px; font-size: 11px; }
    .me-tag { background: #30d158; color: #000; }
  </style>
</head>
<body>
  <div id="app">
    <div class="top-bar">
      <div class="tab-btns">
        <button class="tab-btn" id="btn-0" onclick="switchTab(0)">更表</button>
        <button class="tab-btn active" id="btn-1" onclick="switchTab(1)">主頁</button>
        <button class="tab-btn" id="btn-2" onclick="switchTab(2)">QR碼</button>
      </div>
      <span id="top-clock">--:--</span>
    </div>

    <!-- 分頁 1：中控主頁 -->
    <div class="panel show" id="panel-1">
      <div class="card">
        <div class="bat-row" onclick="editBat()">
          <span style="color:#34d399;">📱 <span id="p-bat">--%</span></span>
          <span style="color:#6b7280;font-size:10px;">點擊改電量</span>
          <span style="color:#38bdf8;">⌚ <span id="w-bat">--%</span></span>
        </div>
        <div class="date-row">
          <span onclick="shiftDay(-1)" style="padding:0 6px;cursor:pointer;">◀</span>
          <span id="g-date">載入日期中...</span>
          <span onclick="shiftDay(1)" style="padding:0 6px;cursor:pointer;">▶</span>
        </div>
        <div class="time-big" id="big-time">--:--<span class="time-sec">:--</span></div>
      </div>

      <div class="card lunar-card">
        <span id="l-date">農曆計算中...</span>
        <span class="badge" id="f-badge">平日</span>
      </div>

      <div class="card" onclick="loadWeather()">
        <div class="weather-head">
          <span id="w-loc">📍 定位氣象中...</span>
          <span class="warn-tag" id="w-warn">無天氣警告</span>
        </div>
        <div class="weather-grid">
          <div class="w-box"><div class="w-lbl">氣溫</div><div class="w-val" id="w-temp">--°C</div></div>
          <div class="w-box"><div class="w-lbl">雨量</div><div class="w-val" style="color:#38bdf8;" id="w-rain">--mm</div></div>
          <div class="w-box"><div class="w-lbl">風力</div><div class="w-val" style="color:#6ee7b7;" id="w-wind">--級</div></div>
        </div>
      </div>
    </div>

    <!-- 分頁 0：今日當更同事 -->
    <div class="panel" id="panel-0" style="justify-content:flex-start;padding-top:6px;">
      <div style="font-size:13px;font-weight:900;color:#30d158;margin-bottom:4px;" id="duty-title">QEH AED 當更名單</div>
      <div id="duty-list" style="display:flex;flex-direction:column;gap:6px;"></div>
    </div>

    <!-- 分頁 2：Mail & CMS 登入 QR Code -->
    <div class="panel" id="panel-2">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center;">
        <div style="background:#fff;color:#000;border-radius:16px;padding:10px 6px;">
          <div style="font-size:16px;font-weight:900;margin-bottom:6px;">Mail</div>
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=https%3A%2F%2Fmail.ha.org.hk" alt="Mail QR" style="width:110px;height:110px;margin:0 auto;display:block;" />
        </div>
        <div style="background:#fff;color:#000;border-radius:16px;padding:10px 6px;">
          <div style="font-size:16px;font-weight:900;margin-bottom:6px;">CMS</div>
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=https%3A%2F%2Fcms.ha.org.hk" alt="CMS QR" style="width:110px;height:110px;margin:0 auto;display:block;" />
        </div>
      </div>
    </div>

    <div style="text-align:center;font-size:10px;color:#6b7280;">QEH AED Watch · 點擊上方按鈕切換頁面</div>
  </div>

  <script>
    var dayOffset = 0;

    function switchTab(idx) {
      for (var i = 0; i < 3; i++) {
        document.getElementById('panel-' + i).className = (i === idx) ? 'panel show' : 'panel';
        document.getElementById('btn-' + i).className = (i === idx) ? 'tab-btn active' : 'tab-btn';
      }
    }

    function shiftDay(d) {
      dayOffset += d;
      updateClock();
      renderDuty();
    }

    function updateClock() {
      var now = new Date();
      var hh = String(now.getHours()).padStart(2, '0');
      var mm = String(now.getMinutes()).padStart(2, '0');
      var ss = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('top-clock').textContent = hh + ':' + mm;
      document.getElementById('big-time').innerHTML = hh + ':' + mm + '<span class="time-sec">:' + ss + '</span>';

      var target = new Date(now.getFullYear(), now.getMonth(), now.getDate() + dayOffset);
      var wdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      document.getElementById('g-date').textContent =
        target.getFullYear() + '年' + (target.getMonth() + 1) + '月' + target.getDate() + '日 ' + wdays[target.getDay()];

      var stems = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
      var branches = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
      var zodiacs = ['鼠','牛','虎','兔','龍','蛇','馬','羊','猴','雞','狗','豬'];
      var cDays = ['','初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];

      try {
        var parts = new Intl.DateTimeFormat('zh-HK-u-ca-chinese', { month: 'long', day: 'numeric' }).formatToParts(target);
        var numParts = new Intl.DateTimeFormat('en-US-u-ca-chinese', { year: 'numeric', day: 'numeric' }).formatToParts(target);
        var mStr = '', yNum = 0, dNum = 0;
        parts.forEach(function(p) { if (p.type === 'month') mStr = p.value; });
        numParts.forEach(function(p) {
          if (p.type === 'year') yNum = parseInt(p.value, 10) || 0;
          if (p.type === 'day') dNum = parseInt(p.value, 10) || 0;
        });
        var gz = yNum > 0 ? (stems[(yNum - 1) % 10] + branches[(yNum - 1) % 12] + '年（' + zodiacs[(yNum - 1) % 12] + '年）') : '丙午年（馬年）';
        document.getElementById('l-date').textContent = '農曆 ' + gz + mStr + (cDays[dNum] || '');
      } catch (e) {
        document.getElementById('l-date').textContent = '農曆 丙午年（馬年）';
      }
    }

    function initBat() {
      var q = new URLSearchParams(window.location.search);
      if (q.get('phoneBat')) localStorage.setItem('p_bat', q.get('phoneBat'));
      if (q.get('watchBat')) localStorage.setItem('w_bat', q.get('watchBat'));
      document.getElementById('p-bat').textContent = (localStorage.getItem('p_bat') || '85') + '%';
      document.getElementById('w-bat').textContent = (localStorage.getItem('w_bat') || '90') + '%';
    }

    function editBat() {
      var val = prompt('輸入「電話電量,Watch電量」例如 85,90：', '85,90');
      if (!val) return;
      var arr = val.split(',');
      if (arr[0]) { localStorage.setItem('p_bat', arr[0].trim()); }
      if (arr[1]) { localStorage.setItem('w_bat', arr[1].trim()); }
      initBat();
    }

    function loadWeather() {
      fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var list = Object.values(data || {}).filter(function(w) { return w && w.actionCode !== 'CANCEL' && w.name; });
          var el = document.getElementById('w-warn');
          if (list.length === 0) {
            el.textContent = '無天氣警告';
            el.className = 'warn-tag';
          } else {
            el.textContent = '⚠️ ' + list.map(function(w) { return w.name; }).join('·');
            el.className = 'warn-tag warn-active';
          }
        }).catch(function() {});

      var fetchMeteo = function(lat, lng, name) {
        fetch('https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lng + '&current=temperature_2m,precipitation,wind_speed_10m')
          .then(function(r) { return r.json(); })
          .then(function(d) {
            var c = d.current || {};
            document.getElementById('w-loc').textContent = '📍 ' + name;
            document.getElementById('w-temp').textContent = Math.round(c.temperature_2m || 0) + '°C';
            document.getElementById('w-rain').textContent = Number(c.precipitation || 0).toFixed(1) + 'mm';
            var kmh = Number(c.wind_speed_10m || 0);
            var lvl = kmh <= 11 ? '2級' : kmh <= 19 ? '3級' : kmh <= 28 ? '4級' : kmh <= 38 ? '5級' : '6+級';
            document.getElementById('w-wind').textContent = lvl;
          }).catch(function() {});
      };

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(p) { fetchMeteo(p.coords.latitude.toFixed(3), p.coords.longitude.toFixed(3), '目前定位'); },
          function() { fetchMeteo(22.312, 114.175, '九龍'); },
          { timeout: 5000 }
        );
      } else {
        fetchMeteo(22.312, 114.175, '九龍');
      }
    }

    function renderDuty() {
      var sample = [
        { name: '陳曦彥', code: 'Ne', me: true },
        { name: '梅潔瑜', code: 'Na', me: false }
      ];
      try {
        var raw = localStorage.getItem('qeh_aed_duty_v26');
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.weeks) {
            document.getElementById('duty-title').textContent = 'QEH AED 更表 (已連結本機資料)';
          }
        }
      } catch (e) {}
      document.getElementById('duty-list').innerHTML = sample.map(function(s) {
        return '<div class="duty-item ' + (s.me ? 'duty-me' : '') + '"><span>' + s.name + '</span><span class="code-tag ' + (s.me ? 'me-tag' : '') + '">' + s.code + '</span></div>';
      }).join('');
    }

    updateClock();
    setInterval(updateClock, 1000);
    initBat();
    loadWeather();
    renderDuty();
  </script>
</body>
</html>
